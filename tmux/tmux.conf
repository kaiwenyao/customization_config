# --- 前缀键:Ctrl-a ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix            # 连按两次 Ctrl-a 把它发给 shell(跳到行首)

# --- 基础体验 ---
set -g mouse on                 # 鼠标滚动、点选窗格、拖拽调整大小
set -g history-limit 50000      # 默认只有 2000 行回滚
set -sg escape-time 10          # 默认 500ms,会让 vim/neovim 里按 Esc 明显卡顿
set -g focus-events on          # 让编辑器能感知焦点切换(自动重载文件)
set -g base-index 1             # 窗口从 1 开始编号,和键盘数字键顺序一致
setw -g pane-base-index 1
set -g renumber-windows on      # 关掉中间的窗口后自动重新编号

# --- 颜色 ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"   # 真彩色,否则主题颜色会失真

# --- 分屏 / 新窗口沿用当前目录 ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- 窗格切换(vim 方向键) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- 复制模式:vi 键位 + 系统剪贴板(macOS / Linux 通用) ---
setw -g mode-keys vi
set -s set-clipboard on         # OSC 52:通过 SSH 也能复制到本地终端的剪贴板
# 有本机剪贴板工具时同时写进去;都没有(比如无桌面的服务器)就只走 OSC 52
# 后面的行覆盖前面的,所以优先级是 pbcopy > wl-copy > xclip
if-shell '[ -n "$DISPLAY" ] && command -v xclip' 'set -s copy-command "xclip -selection clipboard"'
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy' 'set -s copy-command "wl-copy"'
if-shell 'command -v pbcopy' 'set -s copy-command "pbcopy"'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# --- 改完配置后 prefix + r 重载 ---
bind r source-file ~/.tmux.conf \; display "配置已重载"
